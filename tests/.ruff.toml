extend = "../pyproject.toml"

[lint]
extend-ignore = [
  "assignment-default-in-stub", # flake8-pyi - assignment-default-in-stub
  "non-self-return-type", # flake8-pyi - non-self-return-type
  "unused-variable", # pyflakes - unused-variable
  "too-many-locals", # pylint/refactor - too-many-locals
  "import-private-name", # pylint/convention - import-private-name
]
